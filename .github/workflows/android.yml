name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Determine build type
        id: build-type
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || echo "$COMMIT_MSG" | grep -qi "Release"; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/release" >> "$GITHUB_OUTPUT"
            echo "artifact_name=kunyin-release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/debug" >> "$GITHUB_OUTPUT"
            echo "artifact_name=kunyin-debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "microsoft"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install NDK & CMake
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          SIGN_ARGS=()
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_STORE_FILE"
            SIGN_ARGS=("-PKEYSTORE_STORE_FILE=$KEYSTORE_STORE_FILE" "-PKEYSTORE_KEY_ALIAS=$KEYSTORE_KEY_ALIAS" "-PKEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" "-PKEYSTORE_KEY_PASSWORD=$KEYSTORE_KEY_PASSWORD")
          fi
          ./gradlew ${{ steps.build-type.outputs.task }} --no-daemon "${SIGN_ARGS[@]}"
          rm -f "$KEYSTORE_STORE_FILE"
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          OLLVM_ENABLED: ${{ env.OLLVM_ENABLED }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}
          KEYSTORE_STORE_FILE: ${{ secrets.KEYSTORE_STORE_FILE }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          VERSION_NAME=$(grep -E '^var verName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          BUILD_TYPE="${{ steps.build-type.outputs.variant }}"

          cd ${{ steps.build-type.outputs.apk_path }}
          for apk in *.apk; do
            mv "$apk" "kunyin-${BUILD_TYPE}_${VERSION_NAME}_${GIT_HASH}.apk"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-type.outputs.artifact_name }}
          path: ${{ steps.build-type.outputs.apk_path }}/*.apk
          retention-days: 30
        continue-on-error: true

      - name: Generate update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION_NAME=$(grep -E '^var verName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep -E '^var verCode' app/build.gradle.kts | sed 's/[^0-9]//g')
          APK_FILE=$(ls ${{ steps.build-type.outputs.apk_path }}/*.apk | head -1)

          # 从 LOG.md 截取当前版本的更新日志（"## v<版本>" 到下一个 "## " 之间）
          awk -v ver="## v${VERSION_NAME}" '
            { sub(/\r$/, "") }
            $0 == ver { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' LOG.md | sed '/./,$!d' > release_notes.md

          jq -n \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg apk "$(basename "$APK_FILE")" \
            --arg sha256 "$(sha256sum "$APK_FILE" | cut -d' ' -f1)" \
            --rawfile notes release_notes.md \
            '{versionName: $versionName, versionCode: $versionCode, apk: $apk, sha256: $sha256, notes: $notes}' \
            > update.json
          cat update.json

      - name: Publish to Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.build-type.outputs.apk_path }}/*.apk
            update.json
          body_path: release_notes.md
          generate_release_notes: true
